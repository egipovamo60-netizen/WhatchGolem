; OpenALPR configuration file
; Used by OpenALPR to recognize license plates

[global]
; Country/region code
country = ru

; Number of top candidate plates to return
topn = 10

; Number of detection runs to perform
analysis_count = 2

; Minimum plate detection confidence (0-1)
; Lower values will detect more plates (including false positives)
detection_iteration_increase = 0.05
max_plate_read_length = 11

; Other parameters
allow_digits_only = 1
state_detection = 0
skip_detection = 0

[license_plate_char_segment]
; Settings for character segmentation
use_adaptive_thresholding = 1

[license_plate_recognition]
; Settings for character recognition
neural_net_thresh = 0.5
